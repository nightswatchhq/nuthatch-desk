[workspace]
resolver = "3"
members = ["crates/mock-nest", "crates/nest-client", "crates/desk-core", "crates/desk-bridge", "crates/desk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightswatchhq/nuthatch-desk"

[workspace.dependencies]
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = "0.10.0"
cxx-qt-build = "0.10.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
