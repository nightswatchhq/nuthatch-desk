# What may be built into nuthatch-desk. `cargo deny check` runs this in CI.
#
# The project is MIT OR Apache-2.0 and links nothing copyleft from crates.io. Qt itself is not a
# crate and is not covered here: it is used under the LGPL and linked dynamically, which is why
# the project ships source and no binaries.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
